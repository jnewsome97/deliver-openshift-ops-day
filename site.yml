---
site:
  title: OpenShift Ops Day Roadshow
  url: https://github.com/rhpds/openshift-days-ops-showroom
  start_page: openshift-days-ops-track::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    # snapshot: false (default) - the release tag is version-pinned (v4), so treat
    # the bundle as immutable and let Antora reuse the cached copy on rebuilds
    # instead of re-fetching it from GitHub on every invocation.
    url: https://github.com/jnewsome97/rhdp_showroom_theme_execute/releases/download/rh-one-2025-execute-v4/ui-bundle.zip
  supplemental_files:
    - path: ./content/supplemental-ui
    - path: ./content/lib
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"

runtime:
  cache_dir: ./.cache/antora

antora:
  extensions:
    - require: ./content/lib/dev-mode.js
      enabled: false
    - require: ./content/lib/serve-support.js

output:
  dir: ./www

# Module attributes for ifeval conditionals in nav.adoc
# Soft-set ('true@') so user_data values merged into antora.yml by the
# antora-builder init container can override per-deployment. Local preview
# still shows all modules by default since antora.yml has no module_enable_*
# overrides.
asciidoc:
  attributes:
    toclevels: 2
    # Module flags - matches catalog parameter names (module_enable_*)
    # Getting Started
    module_enable_install: 'true@'
    # Core Operations
    module_enable_appmgmt: 'true@'
    module_enable_ingress: 'true@'
    module_enable_netsec: 'true@'
    module_enable_debugging: 'true@'
    module_enable_gitops: 'true@'
    # Identity & Access
    module_enable_ldap: 'true@'
    module_enable_oidc: 'true@'
    # Day 2 Operations
    module_enable_observability: 'true@'
    module_enable_performance: 'true@'
    # Advanced Topics
    module_enable_virt: 'true@'
    module_enable_devhub: 'true@'
    module_enable_ols: 'true@'
    module_enable_acm: 'true@'
    module_enable_security: 'true@'
    module_enable_ztwim: 'true@'
    module_enable_vault: 'true@'
