---
- name: Apply image prefetch DaemonSet
  kubernetes.core.k8s:
    state: present
    namespace: "{{ ocp4_workload_image_prefetch_namespace }}"
    definition: "{{ lookup('template', 'image_prefetch_daemonset.yml.j2') | from_yaml }}"
  when: ocp4_workload_image_prefetch_images | length > 0

- name: Wait for image prefetch DaemonSet to be scheduled on all matching nodes
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    name: image-prefetch
    namespace: "{{ ocp4_workload_image_prefetch_namespace }}"
  register: ocp4_workload_image_prefetch_ds_info
  until:
  - ocp4_workload_image_prefetch_ds_info.resources | length > 0
  - ocp4_workload_image_prefetch_ds_info.resources[0].status.desiredNumberScheduled | default(0) > 0
  retries: 30
  delay: 10
  ignore_errors: true
  when: ocp4_workload_image_prefetch_images | length > 0

# The prefetch DaemonSet's containers only need to pull the real workload
# images, not run them, so the template overrides each container's command to
# `sleep infinity`. containerStatuses[].imageID is populated as soon as the
# image is pulled, independent of container readiness, so it's used here
# instead of pod/DaemonSet readiness (which would otherwise require the sleep
# process to pass a readiness probe that was never configured).
#
# Previously these containers ran each image's real entrypoint with no
# config, which OOMKilled against the 20Mi memory limit and crash-looped for
# the rest of the wait budget. That churn was assumed harmless, but on a
# compact cluster it can starve an unrelated pod scheduled on the same node -
# confirmed live: this starved openshift-cnv's virt-operator deployment hard
# enough to fail its CSV install.
- name: Wait for image prefetch DaemonSet to finish pulling its images on every node
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ ocp4_workload_image_prefetch_namespace }}"
    label_selectors:
    - app=image-prefetch
  register: ocp4_workload_image_prefetch_pod_info
  until:
  - ocp4_workload_image_prefetch_ds_info.resources | length > 0
  - (ocp4_workload_image_prefetch_pod_info.resources
      | map(attribute='status.containerStatuses', default=[])
      | map('selectattr', 'imageID', 'defined')
      | map('list')
      | map('length')
      | sum)
    == ((ocp4_workload_image_prefetch_ds_info.resources[0].status.desiredNumberScheduled | default(0))
        * (ocp4_workload_image_prefetch_images | length))
  retries: 60
  delay: 20
  # Non-fatal: the dependent workload (e.g. the agentic OLS Deployment)
  # typically isn't created for a while yet - the pull keeps going in the
  # background regardless of this task's outcome, so a slow or incomplete
  # prefetch should never be worse than no prefetch at all.
  ignore_errors: true
  when: ocp4_workload_image_prefetch_images | length > 0

# Leave this as the last task in the playbook.
# --------------------------------------------
- name: workload tasks complete
  debug:
    msg: "Workload Tasks completed successfully."
  when: not silent | bool
