---
- name: Final cluster cleanup pass
  when: ACTION == "provision"
  ansible.builtin.include_role:
    name: deliver_openshift_ops_day.automation.ocp4_workload_cluster_cleanup

# Every operator that registers a ConsolePlugin (gitops, acm/hcp, security/
# RHACS, ols/lightspeed, etc.) makes console-operator roll the openshift-console
# Deployment. Since this file runs last, right after _security_workloads (the
# slowest/heaviest group, so usually the last plugin to register), the claim
# was previously being handed to the learner while that final console rollout
# was still in flight -- their first login would open a websocket watch on a
# console pod that then got killed mid-rollout, which is what was producing
# the blank-page/unresponsive-tab symptom on first load. Block here until the
# console has finished rolling out and stayed stable for a settle window.
- name: "Cluster cleanup final | Wait for openshift-console Deployment to finish rolling out"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: console
    namespace: openshift-console
  register: r_console_deploy
  until:
    - r_console_deploy.resources | default([]) | length > 0
    - r_console_deploy.resources[0].status.observedGeneration | default(-1) == r_console_deploy.resources[0].metadata.generation | default(-2)
    - (r_console_deploy.resources[0].status.updatedReplicas | default(0) | int) == (r_console_deploy.resources[0].spec.replicas | default(1) | int)
    - (r_console_deploy.resources[0].status.readyReplicas | default(0) | int) == (r_console_deploy.resources[0].spec.replicas | default(1) | int)
    - (r_console_deploy.resources[0].status.replicas | default(0) | int) == (r_console_deploy.resources[0].spec.replicas | default(1) | int)
  retries: 30
  delay: 10
  when: ACTION == "provision"

- name: "Cluster cleanup final | Hold to let console settle in case another plugin registers late"
  ansible.builtin.pause:
    seconds: 60
  when: ACTION == "provision"

- name: "Cluster cleanup final | Confirm console Deployment is still stable after settle window"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: console
    namespace: openshift-console
  register: r_console_deploy_final
  until:
    - r_console_deploy_final.resources | default([]) | length > 0
    - r_console_deploy_final.resources[0].status.observedGeneration | default(-1) == r_console_deploy_final.resources[0].metadata.generation | default(-2)
    - (r_console_deploy_final.resources[0].status.updatedReplicas | default(0) | int) == (r_console_deploy_final.resources[0].spec.replicas | default(1) | int)
    - (r_console_deploy_final.resources[0].status.readyReplicas | default(0) | int) == (r_console_deploy_final.resources[0].spec.replicas | default(1) | int)
  retries: 30
  delay: 10
  when: ACTION == "provision"

# RHACS's legacy scanner-db Postgres data directory is backed by an emptyDir
# with no size limit and no ephemeral-storage request/limit on the container,
# so the scheduler has zero disk-footprint awareness for it and will happily
# stack it (and its replacement, after eviction) back onto an already
# disk-pressured node. Measured steady-state usage on a live cluster is ~8Gi
# after the scanner's CVE data is loaded, growing higher during WAL/vacuum
# activity, so request/limit are set well above that. central-db,
# scanner-v4-db, and scanner-v4-indexer/matcher are PVC-backed and aren't
# affected by this. The Central CR is continuously reconciled by the StackRox
# operator, so this patches the CR spec (the desired state the operator reads
# from) rather than the child Deployment directly, which the operator would
# otherwise revert on its next reconcile.
- name: "Cluster cleanup final | Set ephemeral-storage requests/limits on RHACS legacy scanner-db"
  kubernetes.core.k8s:
    state: patched
    api_version: platform.stackrox.io/v1alpha1
    kind: Central
    name: stackrox-central-services
    namespace: stackrox
    definition:
      spec:
        scanner:
          db:
            resources:
              requests:
                ephemeral-storage: 8Gi
              limits:
                ephemeral-storage: 16Gi
  when:
    - ACTION == "provision"
    - module_enable_security | default(false) | bool
      or module_enable_ztwim | default(false) | bool
      or module_enable_vault | default(false) | bool

# core_workloads' ocp4_workload_metallb role hardcodes its own dedicated
# redhat-operators-snapshot-mtv CatalogSource (metallb-system namespace)
# instead of using the shared redhat-operators-snapshot source every other
# snapshot-dependent role here uses — that's internal to the core_workloads
# collection, not something this repo can change. It's a full mirror of the
# entire redhat-operators index, so every package in it (Loki Operator, Red
# Hat OpenShift Logging, etc.) shows up as an extra duplicate tile in the
# Software Catalog alongside the live redhat-operators entry. By this point
# metallb-operator's Subscription has already resolved and its CSV has
# succeeded, so the CatalogSource has done its job; deleting it removes the
# duplicate tiles without affecting the already-installed operator (only a
# future *upgrade* resolved against that source would be affected, which
# doesn't matter on these short-lived clusters). Same pattern already used
# in ocp4_workload_cluster_cleanup for the unused default catalogs.
- name: "Cluster cleanup final | Delete metallb's dedicated snapshot CatalogSource now that its subscription has resolved"
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1alpha1
    kind: CatalogSource
    name: redhat-operators-snapshot-mtv
    namespace: metallb-system
  when:
    - ACTION == "provision"
    - module_enable_acm | default(true) | bool
  ignore_errors: true

- name: Skip cleanup on destroy
  when: ACTION == "destroy"
  debug:
    msg: "Skipping cluster cleanup on destroy"
