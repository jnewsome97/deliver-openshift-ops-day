# ==============================================================================
# Prometheus Retention Reduction (optional - enabled via workshop_reduce_prometheus_retention)
#
# Default Prometheus keeps 15 days of metrics. Each instance uses ~5 GiB RSS
# on a busy cluster. Reducing retention to 2d saves ~2 GiB per instance
# (~4 GiB total) by loading fewer TSDB blocks.
#
# This merges retention into the existing cluster-monitoring-config ConfigMap.
# The ConfigMap may already contain enableUserWorkload (from the deployer) and
# additionalAlertmanagerConfigs (from ACM MCO). We read the current config,
# merge our value, and write it back to avoid clobbering anything.
#
# Note: Prometheus replicas cannot be changed via ConfigMap in OCP 4.20
# (the CMO webhook rejects the field).
# ==============================================================================

- name: "Prometheus retention reduction - check if enabled"
  debug:
    msg: >-
      workshop_reduce_prometheus_retention={{ workshop_reduce_prometheus_retention | default(false) }}.
      {% if workshop_reduce_prometheus_retention | default(false) | bool %}
      Will set retention={{ workshop_prometheus_retention }}.
      {% else %}
      Skipping Prometheus retention reduction (not enabled).
      {% endif %}

- name: Get current cluster-monitoring-config
  when: workshop_reduce_prometheus_retention | default(false) | bool
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: cluster-monitoring-config
    namespace: openshift-monitoring
  register: r_monitoring_config

- name: Merge Prometheus retention into cluster-monitoring-config
  when: workshop_reduce_prometheus_retention | default(false) | bool
  vars:
    _existing_config: >-
      {{ (r_monitoring_config.resources[0].data['config.yaml'] | default('{}')) | from_yaml }}
    _existing_prom: >-
      {{ _existing_config.prometheusK8s | default({}) }}
    _merged_prom: >-
      {{ _existing_prom | combine({'retention': workshop_prometheus_retention}) }}
    _merged_config: >-
      {{ _existing_config | combine({'prometheusK8s': _merged_prom}) }}
  kubernetes.core.k8s:
    state: present
    api_version: v1
    kind: ConfigMap
    name: cluster-monitoring-config
    namespace: openshift-monitoring
    definition:
      data:
        config.yaml: "{{ _merged_config | to_nice_yaml }}"
  register: r_monitoring_config_patch
  ignore_errors: true

- name: "Prometheus retention reduction - result"
  when:
  - workshop_reduce_prometheus_retention | default(false) | bool
  - r_monitoring_config_patch is defined
  debug:
    msg: >-
      {{ 'cluster-monitoring-config patched: retention=' + workshop_prometheus_retention
      if r_monitoring_config_patch is success
      else 'FAILED: ' + (r_monitoring_config_patch.msg | default('unknown error')) }}

# ==============================================================================
# NooBaa Resource Reduction (optional - enabled via workshop_reduce_noobaa_resources)
#
# On compact clusters (3-node control-plane/worker combo), NooBaa's default
# CPU requests (~2000m core + ~1000m endpoint) consume capacity needed by
# workloads deployed later (Quay, LokiStack, etc.).
#
# The NooBaa operator fully manages the NooBaa CR, StatefulSet, and Deployment
# — direct patches are reverted within seconds. The correct path is to set
# resources via the StorageCluster CR, which the OCS operator propagates down:
#   StorageCluster -> OCS operator -> NooBaa CR -> NooBaa operator -> pods
#
# - spec.resources["noobaa-core"] controls core pod resources
# - spec.multiCloudGateway.endpoints.resources controls endpoint pod resources
#
# To revert: remove the StorageCluster patches or set
# workshop_reduce_noobaa_resources to false and rebuild the cluster.
# ==============================================================================

- name: "NooBaa resource reduction - check if enabled"
  debug:
    msg: >-
      workshop_reduce_noobaa_resources={{ workshop_reduce_noobaa_resources | default(false) }}.
      {% if workshop_reduce_noobaa_resources | default(false) | bool %}
      Will patch StorageCluster (core={{ workshop_noobaa_core_cpu_requests }},
      endpoint={{ workshop_noobaa_endpoint_cpu_requests }}).
      {% else %}
      Skipping NooBaa resource reduction (not enabled).
      {% endif %}

- name: Check if StorageCluster exists
  when: workshop_reduce_noobaa_resources | default(false) | bool
  kubernetes.core.k8s_info:
    api_version: ocs.openshift.io/v1
    kind: StorageCluster
    namespace: openshift-storage
  register: r_storagecluster_check
  ignore_errors: true

- name: Reduce NooBaa core resources via StorageCluster
  when:
  - workshop_reduce_noobaa_resources | default(false) | bool
  - r_storagecluster_check.resources | default([]) | length > 0
  kubernetes.core.k8s:
    state: patched
    api_version: ocs.openshift.io/v1
    kind: StorageCluster
    name: "{{ r_storagecluster_check.resources[0].metadata.name }}"
    namespace: openshift-storage
    definition:
      spec:
        resources:
          noobaa-core:
            requests:
              cpu: "{{ workshop_noobaa_core_cpu_requests }}"
              memory: "{{ workshop_noobaa_core_memory_requests }}"
            limits:
              cpu: "{{ workshop_noobaa_core_cpu_limits }}"
              memory: "{{ workshop_noobaa_core_memory_limits }}"
        multiCloudGateway:
          endpoints:
            minCount: 1
            maxCount: 1
            resources:
              requests:
                cpu: "{{ workshop_noobaa_endpoint_cpu_requests }}"
                memory: "{{ workshop_noobaa_endpoint_memory_requests }}"
              limits:
                cpu: "{{ workshop_noobaa_endpoint_cpu_limits }}"
                memory: "{{ workshop_noobaa_endpoint_memory_limits }}"
  register: r_storagecluster_patch
  ignore_errors: true

- name: "NooBaa resource reduction - results"
  when: workshop_reduce_noobaa_resources | default(false) | bool
  debug:
    msg: >-
      StorageCluster {{ 'not found - skipping' if (r_storagecluster_check.resources | default([]) | length == 0) else
      ('patched successfully' if (r_storagecluster_patch is defined and r_storagecluster_patch is success) else
      'FAILED to patch: ' + (r_storagecluster_patch.msg | default('unknown error'))) }}.

# ==============================================================================
# BackingStore memory floor (unconditional)
#
# MCG 4.20+ rejects BackingStores with memory requests below 400Mi.
# The pool provisioning may set a lower value (e.g. 256Mi) which causes
# the BackingStore and BucketClass to enter Rejected phase, breaking
# any workload that needs ObjectBucketClaims (Quay, OADP, etc.).
# This runs unconditionally to catch clusters provisioned with bad defaults.
# ==============================================================================
- name: Check BackingStore current memory request
  kubernetes.core.k8s_info:
    api_version: noobaa.io/v1alpha1
    kind: BackingStore
    name: noobaa-default-backing-store
    namespace: openshift-storage
  register: r_backingstore_check
  ignore_errors: true

- name: Patch BackingStore memory to meet MCG minimum
  when:
  - r_backingstore_check.resources | default([]) | length > 0
  - r_backingstore_check.resources[0].status.phase | default('') == 'Rejected'
  kubernetes.core.k8s:
    state: patched
    api_version: noobaa.io/v1alpha1
    kind: BackingStore
    name: noobaa-default-backing-store
    namespace: openshift-storage
    definition:
      spec:
        pvPool:
          resources:
            requests:
              memory: "{{ workshop_noobaa_backingstore_memory_requests }}"
  register: r_backingstore_patch
  ignore_errors: true

- name: Wait for BackingStore to become Ready
  when:
  - r_backingstore_patch is defined
  - r_backingstore_patch is changed
  kubernetes.core.k8s_info:
    api_version: noobaa.io/v1alpha1
    kind: BackingStore
    name: noobaa-default-backing-store
    namespace: openshift-storage
  register: r_backingstore_status
  until:
  - r_backingstore_status.resources[0].status.phase | default('') == 'Ready'
  retries: 60
  delay: 5
  ignore_errors: true

- name: Wait for NooBaa core pod to get reduced CPU requests
  when:
  - workshop_reduce_noobaa_resources | default(false) | bool
  - r_storagecluster_patch is defined
  - r_storagecluster_patch is success
  shell: >
    oc get pod noobaa-core-0 -n openshift-storage
    -o jsonpath='{.spec.containers[0].resources.requests.cpu}'
  register: r_noobaa_core_cpu
  until: r_noobaa_core_cpu.stdout == workshop_noobaa_core_cpu_requests
  retries: 60
  delay: 5
  changed_when: false
  ignore_errors: true

- name: Wait for NooBaa endpoint pod to get reduced CPU requests
  when:
  - workshop_reduce_noobaa_resources | default(false) | bool
  - r_storagecluster_patch is defined
  - r_storagecluster_patch is success
  shell: >
    oc get pods -n openshift-storage -l noobaa-s3=noobaa
    -o jsonpath='{.items[0].spec.containers[0].resources.requests.cpu}'
  register: r_noobaa_endpoint_cpu
  until: r_noobaa_endpoint_cpu.stdout == workshop_noobaa_endpoint_cpu_requests
  retries: 60
  delay: 5
  changed_when: false
  ignore_errors: true

- name: "NooBaa resource reduction - rollout status"
  when:
  - workshop_reduce_noobaa_resources | default(false) | bool
  - r_storagecluster_patch is defined
  - r_storagecluster_patch is success
  debug:
    msg: >-
      Core: {{ 'ready (' + r_noobaa_core_cpu.stdout + ')' if (r_noobaa_core_cpu is success) else
      'TIMEOUT - pod still at ' + (r_noobaa_core_cpu.stdout | default('unknown')) + ' after 5 min' }}.
      Endpoint: {{ 'ready (' + r_noobaa_endpoint_cpu.stdout + ')' if (r_noobaa_endpoint_cpu is success) else
      'TIMEOUT - pod still at ' + (r_noobaa_endpoint_cpu.stdout | default('unknown')) + ' after 5 min' }}.

# ==============================================================================
# LVMS Deployment Section (optional - enabled via workshop_deploy_lvms: true)
# Deploys LVMS operator with optionalPaths for AWS NVMe device handling
# ==============================================================================

- name: Create openshift-storage namespace for LVMS
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ workshop_lvms_namespace }}"
        labels:
          openshift.io/cluster-monitoring: "true"
  when: workshop_deploy_lvms | default(false) | bool

- name: Create CatalogSource for LVMS (snapshot)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: CatalogSource
      metadata:
        name: "{{ workshop_lvms_catalogsource_name }}"
        namespace: openshift-marketplace
      spec:
        sourceType: grpc
        image: "{{ workshop_lvms_catalog_snapshot_image }}:{{ workshop_lvms_catalog_snapshot_image_tag }}"
        displayName: LVMS Catalog Snapshot
  when:
    - workshop_deploy_lvms | default(false) | bool
    - workshop_lvms_use_catalog_snapshot | default(false) | bool

- name: Check if OperatorGroup already exists in namespace
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1
    kind: OperatorGroup
    namespace: "{{ workshop_lvms_namespace }}"
  register: existing_operatorgroup
  when: workshop_deploy_lvms | default(false) | bool

- name: Create OperatorGroup for LVMS (only if none exists)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: lvms-operatorgroup
        namespace: "{{ workshop_lvms_namespace }}"
      spec:
        targetNamespaces:
          - "{{ workshop_lvms_namespace }}"
  when:
    - workshop_deploy_lvms | default(false) | bool
    - existing_operatorgroup.resources | default([]) | length == 0

- name: Create LVMS Subscription
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: lvms-operator
        namespace: "{{ workshop_lvms_namespace }}"
      spec:
        channel: "{{ workshop_lvms_channel }}"
        installPlanApproval: Automatic
        name: lvms-operator
        source: "{{ workshop_lvms_use_catalog_snapshot | default(false) | ternary(workshop_lvms_catalogsource_name, 'redhat-operators') }}"
        sourceNamespace: openshift-marketplace
  when: workshop_deploy_lvms | default(false) | bool

- name: Wait for LVMS Subscription to have installedCSV
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: lvms-operator
    namespace: "{{ workshop_lvms_namespace }}"
  register: lvms_subscription
  until:
    - lvms_subscription.resources | length > 0
    - lvms_subscription.resources[0].status is defined
    - lvms_subscription.resources[0].status.installedCSV is defined
    - lvms_subscription.resources[0].status.installedCSV | length > 0
  retries: 60
  delay: 10
  when: workshop_deploy_lvms | default(false) | bool

- name: Wait for LVMS CSV to be Succeeded
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    name: "{{ lvms_subscription.resources[0].status.installedCSV }}"
    namespace: "{{ workshop_lvms_namespace }}"
  register: lvms_csv
  until:
    - lvms_csv.resources | length > 0
    - lvms_csv.resources[0].status is defined
    - lvms_csv.resources[0].status.phase is defined
    - lvms_csv.resources[0].status.phase == "Succeeded"
  retries: 60
  delay: 10
  when: workshop_deploy_lvms | default(false) | bool

- name: Create LVMCluster with optionalPaths
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: lvm.topolvm.io/v1alpha1
      kind: LVMCluster
      metadata:
        name: lvmcluster
        namespace: "{{ workshop_lvms_namespace }}"
      spec:
        storage:
          deviceClasses:
            - name: "{{ workshop_lvms_vg_name }}"
              default: true
              deviceSelector: "{{ lookup('template', 'lvms_device_selector.j2') | from_yaml }}"
              thinPoolConfig:
                name: thin-pool-1
                sizePercent: 90
                overprovisionRatio: 10
  when: workshop_deploy_lvms | default(false) | bool

- name: Wait for LVMCluster to be ready
  kubernetes.core.k8s_info:
    api_version: lvm.topolvm.io/v1alpha1
    kind: LVMCluster
    name: lvmcluster
    namespace: "{{ workshop_lvms_namespace }}"
  register: lvmcluster_status
  until:
    - lvmcluster_status.resources | length > 0
    - lvmcluster_status.resources[0].status is defined
    - lvmcluster_status.resources[0].status.state is defined
    - lvmcluster_status.resources[0].status.state == "Ready"
  retries: 60
  delay: 10
  when: workshop_deploy_lvms | default(false) | bool

- name: Display LVMS deployment status
  debug:
    msg: "LVMS deployed successfully with LVMCluster in Ready state"
  when: workshop_deploy_lvms | default(false) | bool

# ==============================================================================
# End LVMS Deployment Section
# ==============================================================================

- name: create the variable template file
  template:
    src: files/workshop-settings.j2
    dest: /tmp/workshop-settings.sh

# Wait for Showroom to be deployed (by ocp4_workload_showroom)
# Using namespace-based lookup instead of label selectors (more reliable)
- name: Set Showroom namespace
  set_fact:
    showroom_namespace: "showroom-{{ guid }}"

- name: Wait for Showroom deployment to exist
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ showroom_namespace }}"
  register: showroom_deployment_r
  until: showroom_deployment_r.resources | length > 0
  retries: 10
  delay: 10

- name: Read workshop settings file from bastion
  slurp:
    src: /tmp/workshop-settings.sh
  register: workshop_settings_content

- name: Create ConfigMap with workshop environment variables
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: workshop-env
        namespace: "{{ showroom_namespace }}"
        labels:
          app: showroom
      data:
        workshop-settings.sh: "{{ workshop_settings_content.content | b64decode }}"

- name: Parse workshop settings into individual variables for ConfigMap
  set_fact:
    workshop_vars: >-
      {%- set result = {} -%}
      {%- for key, value in workshop_settings_content.content | b64decode | regex_findall('([A-Z_]+)=(.*)') -%}
      {%- set _ = result.update({key: value}) -%}
      {%- endfor -%}
      {{ result }}

- name: Create ConfigMap with individual environment variables
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: workshop-vars
        namespace: "{{ showroom_namespace }}"
        labels:
          app: showroom
      data: "{{ workshop_vars }}"

# ==============================================================================
# Pre-patch diagnostics - dump the Deployment structure before we touch it
# ==============================================================================
- name: DEBUG - Showroom Deployment structure before patching
  shell: |
    NS="{{ showroom_namespace }}"
    echo "=== DEPLOYMENT OVERVIEW ==="
    oc get deployment showroom -n $NS -o wide 2>&1 || true
    echo ""
    echo "=== CONTAINERS ==="
    oc get deployment showroom -n $NS -o json | python3 -c "
    import json,sys; d=json.load(sys.stdin)
    for c in d['spec']['template']['spec'].get('containers',[]):
        print(f\"container: {c['name']}  image: {c.get('image','N/A')}  mem_limit: {c.get('resources',{}).get('limits',{}).get('memory','unset')}\")" 2>&1 || true
    echo ""
    echo "=== INIT CONTAINERS ==="
    oc get deployment showroom -n $NS -o json | python3 -c "
    import json,sys; d=json.load(sys.stdin)
    for c in d['spec']['template']['spec'].get('initContainers',[]):
        print(f\"initContainer: {c['name']}  image: {c.get('image','N/A')}\")" 2>&1 || true
    echo ""
    echo "=== VOLUMES ==="
    oc get deployment showroom -n $NS \
      -o jsonpath='{range .spec.template.spec.volumes[*]}volume: {.name}{"\n"}{end}' 2>&1 || true
    echo ""
    echo "=== CONTAINER VOLUME MOUNTS ==="
    oc get deployment showroom -n $NS -o json | python3 -c "
    import json,sys; d=json.load(sys.stdin)
    for c in d['spec']['template']['spec'].get('containers',[]):
        print(f\"container: {c['name']}\")
        for m in c.get('volumeMounts',[]):
            sp = f\" (subPath: {m['subPath']})\" if 'subPath' in m else ''
            ro = ' [readOnly]' if m.get('readOnly') else ''
            print(f\"  mount: {m['name']} -> {m['mountPath']}{sp}{ro}\")" 2>&1 || true
    echo ""
    echo "=== INIT CONTAINER VOLUME MOUNTS ==="
    oc get deployment showroom -n $NS -o json | python3 -c "
    import json,sys; d=json.load(sys.stdin)
    for c in d['spec']['template']['spec'].get('initContainers',[]):
        print(f\"initContainer: {c['name']}\")
        for m in c.get('volumeMounts',[]):
            sp = f\" (subPath: {m['subPath']})\" if 'subPath' in m else ''
            print(f\"  mount: {m['name']} -> {m['mountPath']}{sp}\")" 2>&1 || true
    echo ""
    echo "=== CONTAINER ENV/ENVFROM ==="
    oc get deployment showroom -n $NS -o json | python3 -c "
    import json,sys; d=json.load(sys.stdin)
    for c in d['spec']['template']['spec'].get('containers',[]):
        print(f\"container: {c['name']}\")
        for e in c.get('env',[]):
            print(f\"  env: {e['name']}\")
        for ef in c.get('envFrom',[]):
            ref = ef.get('configMapRef',{}).get('name','?')
            print(f\"  envFrom: configMapRef={ref}\")" 2>&1 || true
    echo ""
    echo "=== POD STATUS ==="
    oc get pods -n $NS -o wide 2>&1 || true
  register: showroom_pre_patch_debug
  ignore_errors: true

- name: Display Showroom pre-patch structure
  debug:
    msg: "{{ showroom_pre_patch_debug.stdout_lines | default(['no output']) }}"
  ignore_errors: true

- name: DEBUG - Verify patch prerequisites exist
  shell: |
    echo "=== CHECKING PATCH PREREQUISITES ==="
    echo ""
    echo "--- ConfigMap workshop-vars ---"
    oc get configmap workshop-vars -n {{ showroom_namespace }} -o jsonpath='{.data}' 2>&1 | head -c 500 || echo "NOT FOUND"
    echo ""
    echo ""
    echo "--- ConfigMap workshop-env ---"
    oc get configmap workshop-env -n {{ showroom_namespace }} 2>&1 || echo "NOT FOUND"
    echo ""
    echo "--- Volume showroom-files exists in deployment? ---"
    oc get deployment showroom -n {{ showroom_namespace }} \
      -o jsonpath='{.spec.template.spec.volumes[?(@.name=="showroom-files")].name}' 2>&1 || true
    RESULT=$(oc get deployment showroom -n {{ showroom_namespace }} \
      -o jsonpath='{.spec.template.spec.volumes[?(@.name=="showroom-files")].name}' 2>/dev/null)
    if [ "$RESULT" = "showroom-files" ]; then
      echo "FOUND"
    else
      echo "WARNING: volume 'showroom-files' not found in deployment - patch will fail!"
      echo "Available volumes:"
      oc get deployment showroom -n {{ showroom_namespace }} \
        -o jsonpath='{range .spec.template.spec.volumes[*]}{.name}{"\n"}{end}' 2>&1
    fi
    echo ""
    echo "--- Expected containers exist? ---"
    for CNAME in content wetty; do
      FOUND=$(oc get deployment showroom -n {{ showroom_namespace }} \
        -o jsonpath="{.spec.template.spec.containers[?(@.name==\"$CNAME\")].name}" 2>/dev/null)
      if [ "$FOUND" = "$CNAME" ]; then
        echo "container '$CNAME': FOUND"
      else
        echo "WARNING: container '$CNAME' NOT FOUND - patch may fail!"
      fi
    done
    echo ""
    echo "--- Helm chart version (from labels/annotations) ---"
    oc get deployment showroom -n {{ showroom_namespace }} \
      -o jsonpath='chart={.metadata.labels.helm\.sh/chart}{"\n"}appVersion={.metadata.labels.app\.kubernetes\.io/version}{"\n"}' 2>&1 || true
  register: showroom_prereq_debug
  ignore_errors: true

- name: Display patch prerequisites check
  debug:
    msg: "{{ showroom_prereq_debug.stdout_lines | default(['no output']) }}"
  ignore_errors: true

# ==============================================================================
# Patch Showroom deployment - single strategic merge patch by container name
# This is resilient to container order changes in the showroom deployer.
# Container names (content/wetty) match the current showroom chart's nginx-based
# layout. The older traefik-based layout had a 'runner' container — do not add
# it back or Kubernetes will reject the patch (image field is required).
# ==============================================================================
- name: Patch Showroom deployment (env vars) in a single patch
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: showroom
        namespace: "{{ showroom_namespace }}"
      spec:
        template:
          spec:
            containers:
            - name: content
              envFrom:
              - configMapRef:
                  name: workshop-vars
              resources:
                limits:
                  memory: 512Mi
                requests:
                  memory: 256Mi
            - name: wetty
              envFrom:
              - configMapRef:
                  name: workshop-vars

- name: DEBUG - Showroom Deployment structure after patching
  shell: |
    NS="{{ showroom_namespace }}"
    echo "=== POST-PATCH DEPLOYMENT STATE ==="
    echo ""
    echo "=== CONTAINERS (should include original + patched) ==="
    oc get deployment showroom -n $NS -o json | python3 -c "
    import json,sys; d=json.load(sys.stdin)
    for c in d['spec']['template']['spec'].get('containers',[]):
        print(f\"container: {c['name']}  image: {c.get('image','N/A')}  mem_limit: {c.get('resources',{}).get('limits',{}).get('memory','unset')}\")" 2>&1 || true
    echo ""
    echo "=== VOLUMES (should be unchanged from pre-patch) ==="
    oc get deployment showroom -n $NS \
      -o jsonpath='{range .spec.template.spec.volumes[*]}volume: {.name}{"\n"}{end}' 2>&1 || true
    echo ""
    echo "=== CONTAINER VOLUME MOUNTS (verify merge, not replace) ==="
    oc get deployment showroom -n $NS -o json | python3 -c "
    import json,sys; d=json.load(sys.stdin)
    for c in d['spec']['template']['spec'].get('containers',[]):
        print(f\"container: {c['name']}\")
        for m in c.get('volumeMounts',[]):
            sp = f\" (subPath: {m['subPath']})\" if 'subPath' in m else ''
            ro = ' [readOnly]' if m.get('readOnly') else ''
            print(f\"  mount: {m['name']} -> {m['mountPath']}{sp}{ro}\")" 2>&1 || true
    echo ""
    echo "=== ENVFROM (should show workshop-vars on content, wetty) ==="
    oc get deployment showroom -n $NS -o json | python3 -c "
    import json,sys; d=json.load(sys.stdin)
    for c in d['spec']['template']['spec'].get('containers',[]):
        print(f\"container: {c['name']}\")
        for ef in c.get('envFrom',[]):
            ref = ef.get('configMapRef',{}).get('name','?')
            print(f\"  envFrom: configMapRef={ref}\")" 2>&1 || true
    echo ""
    echo "=== INIT CONTAINERS (should be unchanged) ==="
    oc get deployment showroom -n $NS -o json | python3 -c "
    import json,sys; d=json.load(sys.stdin)
    for c in d['spec']['template']['spec'].get('initContainers',[]):
        print(f\"initContainer: {c['name']}  image: {c.get('image','N/A')}\")" 2>&1 || true
    echo ""
    echo "=== POD STATUS (new pod rolling out) ==="
    oc get pods -n $NS -o wide 2>&1 || true
  register: showroom_post_patch_debug
  ignore_errors: true

- name: Display Showroom post-patch structure
  debug:
    msg: "{{ showroom_post_patch_debug.stdout_lines | default(['no output']) }}"
  ignore_errors: true

- name: Wait for Showroom deployment to roll out after patching
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ showroom_namespace }}"
    name: showroom
  register: showroom_deployment_patched
  until:
    - showroom_deployment_patched.resources[0].status.updatedReplicas is defined
    - showroom_deployment_patched.resources[0].status.updatedReplicas == showroom_deployment_patched.resources[0].spec.replicas
    - showroom_deployment_patched.resources[0].status.readyReplicas is defined
    - showroom_deployment_patched.resources[0].status.readyReplicas == showroom_deployment_patched.resources[0].spec.replicas
  retries: 30
  delay: 10

- name: Wait for Showroom pod to be fully ready
  shell: |
    oc rollout status deployment/showroom -n {{ showroom_namespace }} --timeout=300s

- name: Inject workshop environment variables into antora.yml
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c content -- bash -c '
    if [ -x /showroom/repo/.workshop/inject-env-vars.sh ]; then
      /showroom/repo/.workshop/inject-env-vars.sh
    else
      echo "ERROR: injection script not found or not executable"
      exit 1
    fi'
  register: inject_vars_result
  when: enable_workshop_cli_tools | default(true) | bool

- name: Display variable injection output
  debug:
    msg: "{{ inject_vars_result.stdout_lines }}"
  when: enable_workshop_cli_tools | default(true) | bool

- name: Rebuild Antora site with injected variables
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c content -- bash -c '
    cd /showroom/repo && /opt/app-root/src/.npm-global/bin/antora --cache-dir=/tmp/.cache/antora site.yml'
  register: antora_build_result
  retries: 3
  delay: 15
  until: antora_build_result is succeeded
  when: enable_workshop_cli_tools | default(true) | bool

- name: Display Antora build output
  debug:
    msg: "{{ antora_build_result.stdout_lines | default([]) }}"
  when: enable_workshop_cli_tools | default(true) | bool

- name: Wait for the API and control plane to be stable before updating Showroom
  shell: |
    available=$(oc get co kube-apiserver -o jsonpath='{.status.conditions[?(@.type=="Available")].status}') || exit 1
    progressing=$(oc get co kube-apiserver -o jsonpath='{.status.conditions[?(@.type=="Progressing")].status}') || exit 1
    degraded=$(oc get co kube-apiserver -o jsonpath='{.status.conditions[?(@.type=="Degraded")].status}') || exit 1
    test "$available" = "True" && test "$progressing" = "False" && test "$degraded" = "False"
  register: api_stable_result
  retries: 20
  delay: 15
  until: api_stable_result.rc == 0
  when: enable_workshop_cli_tools | default(true) | bool

- name: Copy built site to served location (preserve showroom panel app)
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c content -- sh -c '
    cp /showroom/www/index.html /tmp/showroom-root-index-backup.html
    cp /showroom/www/ui-config.yml /tmp/showroom-ui-config-backup.yml 2>/dev/null
    cp -r /showroom/repo/www/* /showroom/www/
    cp /tmp/showroom-root-index-backup.html /showroom/www/index.html
    cp /tmp/showroom-ui-config-backup.yml /showroom/www/ui-config.yml 2>/dev/null
    echo "Copied Antora output while preserving showroom panel app"'
  register: copy_site_result
  retries: 5
  delay: 15
  until: copy_site_result.rc == 0
  when: enable_workshop_cli_tools | default(true) | bool

- name: Resolve DOMAIN variable in ui-config.yml
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c content -- sh -c '
    sed -i "s/\${DOMAIN}/{{ route_subdomain }}/g" /showroom/www/ui-config.yml 2>/dev/null
    echo "Resolved DOMAIN to {{ route_subdomain }}"'
  ignore_errors: true
  when: enable_workshop_cli_tools | default(true) | bool

- name: Verify workshop variables are rendered
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c content -- bash -c '
    echo "=== Variable Rendering Verification ==="
    echo "Environment: $(grep -c "Amazon Web Services" /showroom/www/ocp-admin-storage/main/index.html || echo 0) occurrences"
    echo "SSH Username: $(grep -c "ssh -l.*bastion\." /showroom/www/ocp-admin-storage/main/installation.html || echo 0) occurrences"'
  register: verify_result
  when: enable_workshop_cli_tools | default(true) | bool

- name: Display verification results
  debug:
    msg: "{{ verify_result.stdout_lines }}"
  when: enable_workshop_cli_tools | default(true) | bool

- name: Run workshop CLI tools setup in terminal container
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c wetty -- sh -c '
      if [ -x /showroom/repo/.workshop/setup ]; then
        /showroom/repo/.workshop/setup
      else
        echo "No .workshop/setup script found, skipping"
      fi
    '
  register: cli_setup_result
  ignore_errors: true
  when: enable_workshop_cli_tools | default(true) | bool

- name: Display CLI tools setup output
  debug:
    msg: "{{ cli_setup_result.stdout_lines | default(['no output']) }}"
  when:
    - enable_workshop_cli_tools | default(true) | bool
    - cli_setup_result is defined
# ==============================================================================
# End CLI tools auto-install section
# ==============================================================================

- name: Grant cluster-admin to Showroom serviceaccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "showroom-cluster-admin-{{ guid }}"
        labels:
          app: showroom
          guid: "{{ guid }}"
      subjects:
      - kind: ServiceAccount
        name: showroom
        namespace: "{{ showroom_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
  register: clusterrolebinding

- name: Fetch Showroom route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: showroom
    namespace: "{{ showroom_namespace }}"
  register: Route

- name: Publish workshop data for info-message-template rendering
  agnosticd.core.agnosticd_user_info:
    data:
      showroom_url: "https://{{ Route.resources[0].spec.host }}"
      support_base_url: "https://{{ Route.resources[0].spec.host }}/support"
      openshift_cluster_console_url: "{{ master_url }}"
      openshift_api_server_url: "{{ api_url }}"
      openshift_cluster_admin_password: "{{ common_admin_password | default('not-set') }}"
      openshift_cluster_admin_username: "admin"
      route_subdomain: "{{ route_subdomain }}"
      guid: "{{ guid }}"
      module_enable_install: "{{ module_enable_install | default(true) }}"
      module_enable_appmgmt: "{{ module_enable_appmgmt | default(true) }}"
      module_enable_ingress: "{{ module_enable_ingress | default(true) }}"
      module_enable_netsec: "{{ module_enable_netsec | default(true) }}"
      module_enable_debugging: "{{ module_enable_debugging | default(true) }}"
      module_enable_gitops: "{{ module_enable_gitops | default(true) }}"
      module_enable_ldap: "{{ module_enable_ldap | default(true) }}"
      module_enable_oidc: "{{ module_enable_oidc | default(true) }}"
      module_enable_observability: "{{ module_enable_observability | default(true) }}"
      module_enable_performance: "{{ module_enable_performance | default(true) }}"
      module_enable_virt: "{{ module_enable_virt | default(true) }}"
      module_enable_devhub: "{{ module_enable_devhub | default(true) }}"
      module_enable_ols: "{{ module_enable_ols | default(true) }}"
      module_enable_acm: "{{ module_enable_acm | default(true) }}"
      module_enable_security: "{{ module_enable_security | default(true) }}"
      module_enable_ztwim: "{{ module_enable_ztwim | default(true) }}"
      module_enable_vault: "{{ module_enable_vault | default(true) }}"

# ==============================================================================
# OpenShift Lightspeed demo resources
# Deploys a faulty pod for Lightspeed troubleshooting exercise
# ==============================================================================

- name: Deploy Lightspeed demo resources
  when: module_enable_ols | default(true) | bool
  block:
    - name: Create Lightspeed demo namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: lightspeed-demo

    - name: Deploy faulty pod for Lightspeed troubleshooting
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'ols_faulty_pod.yml.j2') }}"

    - name: Lightspeed demo resources deployed
      debug:
        msg: "Faulty pod deployed to lightspeed-demo namespace for Lightspeed troubleshooting exercise"
      when: not silent | default(false) | bool

# ==============================================================================
# Pre-create Observability UIPlugin CRs
# COO watches UIPlugin CRs and creates ConsolePlugins, each of which triggers
# a full console rolling restart. Pre-creating them here means the rollout
# happens at provisioning time (no student browser connected) rather than
# during the lab session when it crashes the showroom renderer.
# Students' oc apply commands become no-ops — no rollout, no crash.
# ignore_errors: true — non-blocking until this is fully validated
# ==============================================================================

- name: Pre-create observability UIPlugin CRs to prevent console rollout during lab
  when: module_enable_observability | default(true) | bool
  ignore_errors: true
  block:
    - name: Install Cluster Observability Operator subscription
      shell: |
        cat <<'EOF' | oc apply -f -
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: cluster-observability-operator
          namespace: openshift-operators
        spec:
          channel: stable
          installPlanApproval: Automatic
          name: cluster-observability-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        EOF

    - name: Wait for COO CSV to succeed
      shell: |
        oc get csv -n openshift-operators --no-headers 2>/dev/null | \
          grep cluster-observability-operator | grep -q Succeeded
      register: coo_csv_result
      until: coo_csv_result.rc == 0
      retries: 30
      delay: 10

    - name: Wait for UIPlugin CRD to be established
      shell: |
        oc wait --for=condition=Established \
          crd/uiplugins.observability.openshift.io --timeout=30s

    - name: Pre-create logging UIPlugin
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: observability.openshift.io/v1alpha1
          kind: UIPlugin
          metadata:
            name: logging
          spec:
            type: Logging
            logging:
              lokiStack:
                name: logging-loki

    - name: Pre-create distributed-tracing UIPlugin
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: observability.openshift.io/v1alpha1
          kind: UIPlugin
          metadata:
            name: distributed-tracing
          spec:
            type: DistributedTracing

    - name: Wait for console to finish rolling out after UIPlugin pre-creation
      shell: |
        oc rollout status deployment/console -n openshift-console --timeout=180s

# Leave this as the last task in the playbook.

- name: workload tasks complete
  debug:
    msg: "Workload Tasks completed successfully."
  when: not silent | bool
