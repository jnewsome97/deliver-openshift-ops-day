    oc get certificaterequest -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}: {.status.conditions[0].reason} - {.status.conditions[0].message}{"\n"}{end}' 2>/dev/null | head -20 || echo "No status"
    echo ""
