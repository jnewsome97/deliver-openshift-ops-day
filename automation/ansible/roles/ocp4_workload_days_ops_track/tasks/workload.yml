- name: DEBUG - ODF/OpenShift Data Foundation status
  shell: |
    echo "=== ODF NAMESPACE ==="
    oc get all -n openshift-storage 2>/dev/null | head -40 || echo "openshift-storage namespace not found"
    echo ""
    echo "=== STORAGE CLUSTER STATUS ==="
