    oc get hyperconverged -n openshift-cnv -o wide 2>/dev/null || echo "No HyperConverged found"
    echo ""
    echo "=== KUBEVIRT STATUS ==="
    oc get kubevirt -n openshift-cnv -o wide 2>/dev/null || echo "No KubeVirt found"
    echo ""
