    ai_model_tier: "frontier"
    ai_model_name: "gpt-5"
    ai_justification: "OpenShift Lightspeed (module 13) requires an Azure OpenAI endpoint pre-provisioned as a cluster Secret. Open-source models are not supported by the OLS operator in this configuration."
    non_ga_products: []
