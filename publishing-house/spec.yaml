spec:
  title: "OpenShift Ops Day Roadshow"
  learning_objectives:
    - "Verify cluster health by inspecting ClusterOperators, MachineConfigPools, cluster version, and etcd metrics after installation"
    - "Deploy, expose, scale, and roll back applications using OpenShift workload management primitives including PodDisruptionBudgets and health probes"
    - "Configure HAProxy IngressControllers, Routes, and TLS termination including HSTS and rate limiting"
    - "Implement network segmentation using OVN-Kubernetes NetworkPolicy, AdminNetworkPolicy, EgressFirewall, and EgressIP"
    - "Troubleshoot common workload failures including ImagePullBackOff, CrashLoopBackOff, LimitRange violations, ConfigMap mismatches, and SCC errors"
    - "Deploy and manage GitOps workflows with ArgoCD including drift detection and self-healing application sync"
    - "Configure LDAP and OIDC identity providers with automated group synchronization and RBAC on OpenShift"
    - "Monitor cluster and application health using Prometheus, Alertmanager, Loki, and distributed tracing with Tempo and OpenTelemetry"
    - "Scale workloads automatically using Vertical Pod Autoscaler recommendations and Horizontal Pod Autoscaler under load"
    - "Provision, live-migrate, clone, and snapshot virtual machines using OpenShift Virtualization"
    - "Secure the cluster using RHACS vulnerability scanning, compliance scans against CIS/PCI-DSS/STIG benchmarks, and runtime Policy-as-Code"
    - "Manage secrets centrally with HashiCorp Vault and External Secrets Operator, and establish mTLS workload identity using Zero-Trust Workload Identity Manager"
  modules:
    - id: module-01
      title: "Installation & Verification"
      duration_min: 10
      status: complete
    - id: module-02
      title: "Application Management"
      duration_min: 17
      status: complete
    - id: module-03
      title: "Ingress & Load Balancing"
      duration_min: 25
      status: complete
    - id: module-04
      title: "Network Security"
      duration_min: 12
      status: complete
    - id: module-05
      title: "Debugging & Troubleshooting"
      duration_min: 12
      status: complete
    - id: module-06
      title: "GitOps"
      duration_min: 12
      status: complete
    - id: module-07
      title: "Identity - LDAP"
      duration_min: 17
      status: complete
    - id: module-08
      title: "Identity - OIDC"
      duration_min: 17
      status: complete
    - id: module-09
      title: "Observability & Logging"
      duration_min: 37
      status: complete
    - id: module-10
      title: "Performance Tuning"
      duration_min: 17
      status: complete
    - id: module-11
      title: "Virtualization"
      duration_min: 22
      status: complete
    - id: module-12
      title: "Developer Hub"
      duration_min: 27
      status: complete
    - id: module-13
      title: "Lightspeed"
      duration_min: 17
      status: complete
    - id: module-14
      title: "ACM Multi-Cluster Management"
      duration_min: 30
      status: complete
    - id: module-15
      title: "Advanced Cluster Security"
      duration_min: 17
      status: complete
    - id: module-16
      title: "Secrets Management"
      duration_min: 25
      status: complete
    - id: module-17
      title: "Zero-Trust Workload Identity Manager"
      duration_min: 20
      status: complete
  environment:
    platform: "ocp"
    topology: "per-student"
    cloud_provider: cnv
    max_concurrent_users: 100

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.20"
    cluster_type: "multinode"
    control_plane_instance_count: 3
    control_plane_cpu: 16
    control_plane_ram_gb: 64
    worker_count: 0
    worker_cpu: 0
    worker_ram_gb: 0
    worker_disk_gb: 0

    # --- VM-specific fields (only when platform = rhel-vms) ---
