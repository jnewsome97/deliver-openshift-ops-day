# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: "Classic Showroom trust-based assessment — no automated solve/validate playbooks. Participants self-verify via the OpenShift web console and oc CLI."
    catalog_gap: "The existing Roadshow provides participant-facing hands-on content for cluster administrators across 17 operational topics. This migration re-scopes the lab from a train-the-trainer framing to the actual participant-facing Roadshow experience."
    design_overview: "Modular hands-on lab for cluster administrators to operate OpenShift across 17 selectable topics spanning installation verification, application lifecycle, networking, identity federation, observability, security, virtualization, multi-cluster management, and AI-assisted operations on a per-student 3-node compact cluster running OCP 4.20."
    module_summaries:
      - title: "Installation & Verification"
        overview: "Post-install health checks using oc commands to inspect ClusterOperators, cluster version, MachineConfigPools, networking, storage, and etcd. Builds confidence that the cluster is ready for production workloads."
      - title: "Application Management"
        overview: "Full application lifecycle on OpenShift: deploy a workload, expose it via a Service and Route, scale replicas, observe self-healing, configure liveness/readiness probes, configure PodDisruptionBudgets, and perform a rollback."
      - title: "Ingress & Load Balancing"
        overview: "Deep-dive into the HAProxy IngressController, Route creation, TLS termination modes, HSTS header injection, and rate limiting policies for ingress traffic control."
      - title: "Network Security"
        overview: "Practical OVN-Kubernetes network security: create NetworkPolicy and AdminNetworkPolicy objects, configure EgressFirewall and EgressIP, and inspect CoreDNS to understand cluster DNS resolution."
      - title: "Debugging & Troubleshooting"
        overview: "Diagnose and fix six intentionally broken microservices covering ImagePullBackOff, CrashLoopBackOff, LimitRange quota exhaustion, missing ConfigMap keys, service selector mismatches, and SCC violations."
      - title: "GitOps"
        overview: "Deploy a GitOps workflow with an ArgoCD Application CR, introduce configuration drift, observe ArgoCD's detection and self-healing behavior, and verify the cluster state converges."
      - title: "Identity - LDAP"
        overview: "Deploy an in-cluster LDAP server (glauth) pre-loaded with workshop users and groups, configure it as an LDAP identity provider on OpenShift, set up group synchronization with a CronJob, and assign RBAC roles to synced groups."
      - title: "Identity - OIDC"
        overview: "Install the Red Hat build of Keycloak operator, configure an OIDC identity provider on OpenShift, and implement automatic group sync driven by token claims."
      - title: "Observability & Logging"
        overview: "Three-part observability deep-dive: metrics with Prometheus and Alertmanager, log aggregation with Loki and Vector via the Cluster Logging Operator backed by ODF/NooBaa S3, and distributed tracing with Tempo and OpenTelemetry. The longest module at 35–40 minutes."
      - title: "Performance Tuning"
        overview: "Apply Vertical Pod Autoscaler to receive right-sizing recommendations, then configure a Horizontal Pod Autoscaler and generate load to observe automatic scale-out and scale-in behavior."
      - title: "Virtualization"
        overview: "Create a RHEL 9 virtual machine using OpenShift Virtualization, perform live migration between nodes, clone the VM, and create and restore a snapshot."
      - title: "Developer Hub"
        overview: "Explore Red Hat Developer Hub: browse the Software Catalog with live Kubernetes health data, use a Software Template to scaffold a component, work through an ops troubleshooting ticket, and view Prometheus metrics surfaced in RHDH."
      - title: "Lightspeed"
        overview: "Configure OLSConfig for the cluster's Azure OpenAI backend, use natural language prompts to generate Kubernetes YAML, and leverage the MCP cluster introspection tool to troubleshoot a broken pod."
      - title: "ACM Multi-Cluster Management"
        overview: "Use RHACM to create a Hosted Control Plane cluster, manage Fleet Virtualization, deploy an application via an ArgoCD ApplicationSet, and enforce a GDPR compliance policy across the fleet."
      - title: "Advanced Cluster Security"
        overview: "Run RHACS vulnerability scans, execute compliance scans against CIS, PCI-DSS, and STIG benchmarks, and create a SecurityPolicy that kills a pod at runtime when it runs apk (Policy-as-Code enforcement)."
      - title: "Secrets Management"
        overview: "Install HashiCorp Vault via Helm, configure the Vault Agent Injector sidecar to deliver secrets to application pods, then install External Secrets Operator and create an ExternalSecret that syncs from Vault."
      - title: "Zero-Trust Workload Identity Manager"
        overview: "Deploy ZTWIM (SPIRE), issue X.509 SVIDs to workloads, configure mTLS between a service and PostgreSQL using the SVIDs, and observe automatic certificate rotation without any secret material in the pod spec."
    rcars_overlap_pct: 99
    rcars_top_matches:
      - title: "Advanced Cluster Management for Kubernetes Demo"
        ci_name: "published.ocp4-acm-demo.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.ocp4-acm-demo.prod"
        relevance_score: 99
        why_it_fits: "Covers RHACM multi-cluster management, OpenShift Virtualization VM lifecycle, OpenShift Lightspeed fleet queries, and ODF — all core topics in this lab — targeting the same intermediate cluster administrator audience."
        workloads:
          - role: "ocp4_workload_authentication"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_ocp_console_embed"
            collection: "agnosticd.showroom"
          - role: "ocp4_workload_ols"
            collection: "agnosticd.ai_workloads"
          - role: "ocp4_workload_rhacm"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_showroom"
            collection: "agnosticd.showroom"
      - title: "Hands-on lab with Red Hat OpenShift Platform Plus (2025)"
        ci_name: "sandboxes-gpte.opp-hol.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=sandboxes-gpte.opp-hol.prod"
        relevance_score: 95
        why_it_fits: "Covers RHACM, RHACS, OpenShift Virtualization, and multi-cluster management at intermediate level for cluster administrators — a partial overlap with several of this lab's 17 topics."
      - title: "Sovereign Cloud Architecture with OpenShift"
        ci_name: "published.sovereign-cloud-lab.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.sovereign-cloud-lab.prod"
        relevance_score: 78
        why_it_fits: "Covers RHACM, RHACS, Virtualization, GitOps, and compliance policies at intermediate level, but scoped to sovereign cloud and GDPR scenarios rather than broad operational topics."
        workloads:
          - role: "ocp4_workload_cert_manager"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_external_odf"
            collection: "agnosticd.core_workloads"
    catalog_gap: "The Roadshow is the only catalog item covering all 17 operational topics in a single modular lab. Every close match covers 4–6 topics well but requires pairing with multiple other labs to achieve the same breadth. The Roadshow's modular delivery format — select any subset of 17 modules via catalog parameters — is also unique in the catalog. Topics absent from all top matches include OpenShift Logging (Loki + Vector), identity federation (LDAP + OIDC with group sync), ZTWIM/mTLS workload identity, and scenario-based debugging exercises."
    rejections: []

