---
# E2E — End-to-end test
# Runs all module solve + validate sequences to verify the full lab
# works from start to finish without manual intervention.
#
# Unlike healthcheck.yml, this is NOT read-only -- module task files under
# tasks/e2e/ create and clean up real resources to simulate what a learner
# would actually do.
#
# This lab has a module selector (module_enable_* catalog parameters, see
# rh1-2027/lb1543-ocp-ops-day-cnv/common.yaml), so not every claim deploys
# the same workloads. Module-specific e2e sequences live in tasks/e2e/ and
# are only included when their module was actually enabled for this claim
# (read from the MODULE_ENABLE_* env vars common.yaml sets on the Showroom
# pod), mirroring the same module-awareness healthcheck.yml uses. Module 1
# (Overview) below is base content, not gated by any module_enable_* flag,
# so it always runs.

- name: End-to-End Test
  hosts: localhost
  connection: local
  gather_facts: false
  # Default kubeconfig for every kubernetes.core.k8s*/helm module in this
  # play to the runtime-automation identity (populated by zerotouch-automation
  # from the runtime-automation-kubeconfig Secret -- see the
  # ocp4_workload_showroom_runtime_automation_* variables in
  # agnosticd/showroom's ocp4_workload_showroom role). Without this, tasks
  # fall back to the pod's own in-cluster identity, which is `edit`-scoped to
  # its own namespace only and cannot read resources in
  # openshift-gitops/monorepo-demo/ansible_test_monorepo.
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
  # module_defaults above only reaches kubernetes.core.k8s* modules. The raw
  # `oc apply` command below needs KUBECONFIG (the CLI's own env var). The
  # nested `ansible-playbook automation/ansible/playbooks/setup.yml`
  # subprocess needs K8S_AUTH_KUBECONFIG instead -- its create_namespace/
  # deploy_busybox roles call kubernetes.core.k8s directly with no
  # kubeconfig of their own, and that module only honors its own
  # K8S_AUTH_KUBECONFIG env var, not the generic KUBECONFIG. Set both so
  # every identity-sensitive call in this play resolves to the
  # runtime-automation identity instead of falling back to the pod's own
  # in-cluster identity (edit-scoped to its own namespace).
  environment:
    KUBECONFIG: "{{ k8s_kubeconfig | default(omit) }}"
    K8S_AUTH_KUBECONFIG: "{{ k8s_kubeconfig | default(omit) }}"
  vars:
    hc_failures: []
    # The env lookup returns '' (not undefined) when a var isn't set, so
    # default() needs boolean=true to treat '' as missing too -- otherwise
    # it never overrides the empty string and every module gate defaults
    # to disabled instead of enabled. Kept in sync with healthcheck.yml.
    module_enable_virt: "{{ lookup('ansible.builtin.env', 'MODULE_ENABLE_VIRT') | default('true', true) | bool }}"
    module_enable_gitops: "{{ lookup('ansible.builtin.env', 'MODULE_ENABLE_GITOPS') | default('true', true) | bool }}"
    module_enable_devhub: "{{ lookup('ansible.builtin.env', 'MODULE_ENABLE_DEVHUB') | default('true', true) | bool }}"
    module_enable_security: "{{ lookup('ansible.builtin.env', 'MODULE_ENABLE_SECURITY') | default('true', true) | bool }}"
    module_enable_ols: "{{ lookup('ansible.builtin.env', 'MODULE_ENABLE_OLS') | default('true', true) | bool }}"
    module_enable_acm: "{{ lookup('ansible.builtin.env', 'MODULE_ENABLE_ACM') | default('true', true) | bool }}"
    module_enable_ztwim: "{{ lookup('ansible.builtin.env', 'MODULE_ENABLE_ZTWIM') | default('true', true) | bool }}"
    module_enable_vault: "{{ lookup('ansible.builtin.env', 'MODULE_ENABLE_VAULT') | default('true', true) | bool }}"
    module_enable_install: "{{ lookup('ansible.builtin.env', 'MODULE_ENABLE_INSTALL') | default('true', true) | bool }}"
    module_enable_appmgmt: "{{ lookup('ansible.builtin.env', 'MODULE_ENABLE_APPMGMT') | default('true', true) | bool }}"
    module_enable_ingress: "{{ lookup('ansible.builtin.env', 'MODULE_ENABLE_INGRESS') | default('true', true) | bool }}"
    module_enable_netsec: "{{ lookup('ansible.builtin.env', 'MODULE_ENABLE_NETSEC') | default('true', true) | bool }}"
    module_enable_debugging: "{{ lookup('ansible.builtin.env', 'MODULE_ENABLE_DEBUGGING') | default('true', true) | bool }}"
    module_enable_observability: "{{ lookup('ansible.builtin.env', 'MODULE_ENABLE_OBSERVABILITY') | default('true', true) | bool }}"
    module_enable_performance: "{{ lookup('ansible.builtin.env', 'MODULE_ENABLE_PERFORMANCE') | default('true', true) | bool }}"
  tasks:

    # -- Module 1: Overview (base content, always runs) ----------------

    - name: "Overview | Run Module 1 end-to-end sequence"
      ansible.builtin.include_tasks: tasks/e2e/overview.yml

    # -- Module e2e sequences (only for modules enabled on this claim) -
    #
    # Gates mirror the *provisioning* bundling documented in README.md
    # (common.yaml doesn't map module_enable_* 1:1 to workloads), so a
    # module's e2e content doesn't silently get skipped for a claim where
    # the underlying workload was actually deployed under a different flag.

    - name: "Virt | Run virtualization module e2e sequence"
      ansible.builtin.include_tasks: tasks/e2e/virt.yml
      when: module_enable_virt or module_enable_acm

    - name: "Gitops | Run GitOps module e2e sequence"
      ansible.builtin.include_tasks: tasks/e2e/gitops.yml
      when: module_enable_gitops or module_enable_acm

    - name: "Devhub | Run Developer Hub module e2e sequence"
      ansible.builtin.include_tasks: tasks/e2e/devhub.yml
      when: module_enable_devhub

    - name: "Security | Run security module e2e sequence"
      ansible.builtin.include_tasks: tasks/e2e/security.yml
      when: module_enable_security or module_enable_ztwim or module_enable_vault

    - name: "Ols | Run OpenShift Lightspeed module e2e sequence"
      ansible.builtin.include_tasks: tasks/e2e/ols.yml
      when: module_enable_ols

    - name: "Acm | Run ACM module e2e sequence"
      ansible.builtin.include_tasks: tasks/e2e/acm.yml
      when: module_enable_acm

    - name: "Ztwim | Run Zero Trust Workload Identity Manager module e2e sequence"
      ansible.builtin.include_tasks: tasks/e2e/ztwim.yml
      when: module_enable_security or module_enable_ztwim or module_enable_vault

    - name: "Vault | Run Vault module e2e sequence"
      ansible.builtin.include_tasks: tasks/e2e/vault.yml
      when: module_enable_security or module_enable_ztwim or module_enable_vault

    - name: "Install | Run installation module e2e sequence"
      ansible.builtin.include_tasks: tasks/e2e/install.yml
      when: module_enable_install

    - name: "Appmgmt | Run application management module e2e sequence"
      ansible.builtin.include_tasks: tasks/e2e/appmgmt.yml
      when: module_enable_appmgmt

    - name: "Ingress | Run ingress module e2e sequence"
      ansible.builtin.include_tasks: tasks/e2e/ingress.yml
      when: module_enable_ingress

    - name: "Netsec | Run network security module e2e sequence"
      ansible.builtin.include_tasks: tasks/e2e/netsec.yml
      when: module_enable_netsec

    - name: "Debugging | Run debugging module e2e sequence"
      ansible.builtin.include_tasks: tasks/e2e/debugging.yml
      when: module_enable_debugging

    # ldap and oidc have no e2e sequence -- see tasks/ldap.yml and
    # tasks/oidc.yml for why (cluster-wide oauth/cluster singleton, not
    # safe to mutate outside a learner's own guided session).

    - name: "Observability | Run observability module e2e sequence"
      ansible.builtin.include_tasks: tasks/e2e/observability.yml
      when: module_enable_observability

    - name: "Performance | Run performance tuning module e2e sequence"
      ansible.builtin.include_tasks: tasks/e2e/performance.yml
      when: module_enable_performance

    # -- Report ------------------------------------------------------------
    # acm.yml and ztwim.yml accumulate into hc_failures (same pattern as
    # healthcheck.yml) rather than failing fast, so a single e2e run can
    # report every problem found instead of stopping at the first one.

    - name: Report healthy
      ansible.builtin.debug:
        msg: "E2E passed, no failures found"
      when: hc_failures | length == 0

    - name: Fail if any e2e checks failed
      ansible.builtin.fail:
        msg: "{{ hc_failures }}"
      when: hc_failures | length > 0
