---
# OpenShift Virtualization module (module_enable_virt).
# Solve/validate sequence for content/modules/ROOT/pages/module-11-virtualization.adoc.
#
# IMPORTANT: that page has the student create project `vm-demo` and VM
# `rhel9-vm` (plus `rhel9-vm-clone`, `rhel9-vm-ssh` service, `rhel9-vm-snapshot`)
# -- this file intentionally uses qa-e2e-prefixed names instead, so an e2e run
# can never collide with a live learner working through the same page.
#
# Scope: this covers the core "create a VM from the rhel9 boot source and
# confirm it's really just a pod underneath" flow that everything else in the
# module depends on (tasks/acm.yml already checks the rhel9 DataSource itself
# is Ready -- this exercises actually consuming it). Live migration, cloning,
# and snapshot/restore are NOT automated here: they take several more minutes
# each (a full disk copy for storage migration, or clone/snapshot I/O) and
# don't have distinct pass/fail signal beyond "the disk operation completed",
# which isn't worth the added runtime/cluster load on every e2e run.

- name: "Virt | Delete qa-e2e-vm-demo project"
  kubernetes.core.k8s:
    state: absent
    api_version: project.openshift.io/v1
    kind: Project
    name: qa-e2e-vm-demo

- name: "Virt | Wait for qa-e2e-vm-demo project to be deleted"
  ansible.builtin.command: oc get project qa-e2e-vm-demo
  register: command_r
  until: command_r.rc == 1
  failed_when: false
  retries: 10
  delay: 5

# Wrapped in block/always so a failure partway through (e.g. the VM never
# reaches Running) still cleans up, instead of leaving a VM/disk stranded on
# the cluster indefinitely.
- name: "Virt | Create, validate, and clean up qa-e2e-rhel9-vm"
  block:
    - name: "Virt | Create qa-e2e-vm-demo project"
      kubernetes.core.k8s:
        state: present
        api_version: project.openshift.io/v1
        kind: Project
        name: qa-e2e-vm-demo

    # Mirrors the console wizard's "Custom configuration" flow: RHEL 9 guest,
    # rhel9 boot source, general-purpose U-series instancetype -- same
    # defaults the DataSource itself advertises
    # (instancetype.kubevirt.io/default-instancetype: u1.medium,
    # default-preference: rhel.9).
    - name: "Virt | Create qa-e2e-rhel9-vm VirtualMachine"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: qa-e2e-rhel9-vm
            namespace: qa-e2e-vm-demo
          spec:
            running: true
            instancetype:
              kind: virtualMachineClusterInstancetype
              name: u1.medium
            preference:
              kind: virtualMachineClusterPreference
              name: rhel.9
            dataVolumeTemplates:
              - metadata:
                  name: qa-e2e-rhel9-vm
                spec:
                  sourceRef:
                    kind: DataSource
                    name: rhel9
                    namespace: openshift-virtualization-os-images
                  storage:
                    resources:
                      requests:
                        storage: 30Gi
            template:
              spec:
                domain:
                  devices: {}
                volumes:
                  - name: qa-e2e-rhel9-vm
                    dataVolume:
                      name: qa-e2e-rhel9-vm

    - name: "Virt | Wait for VirtualMachineInstance to report Running"
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        name: qa-e2e-rhel9-vm
        namespace: qa-e2e-vm-demo
      register: e2e_virt_vmi
      until: >-
        e2e_virt_vmi.resources | default([]) | length > 0 and
        e2e_virt_vmi.resources[0].status.phase | default('') == 'Running'
      retries: 30
      delay: 10
      ignore_errors: true

    - name: "Virt | Fail if VirtualMachineInstance did not reach Running"
      ansible.builtin.fail:
        msg: "virt e2e: qa-e2e-rhel9-vm VMI did not reach Running in qa-e2e-vm-demo"
      when: >-
        e2e_virt_vmi is failed or
        e2e_virt_vmi.resources | default([]) | length == 0 or
        e2e_virt_vmi.resources[0].status.phase | default('') != 'Running'

    # "It's just a pod underneath" is the module's core teaching point --
    # confirm the virt-launcher pod backing this VM is actually there and
    # Running, the same way a student's `oc get pods -n vm-demo` would show.
    - name: "Virt | Get virt-launcher pod for qa-e2e-rhel9-vm"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: qa-e2e-vm-demo
        label_selectors:
          - vm.kubevirt.io/name=qa-e2e-rhel9-vm
      register: e2e_virt_pod

    - name: "Virt | Fail if virt-launcher pod is missing or not Running"
      ansible.builtin.fail:
        msg: "virt e2e: virt-launcher pod for qa-e2e-rhel9-vm not Running in qa-e2e-vm-demo"
      when: >-
        e2e_virt_pod.resources | default([]) | length == 0 or
        e2e_virt_pod.resources[0].status.phase | default('') != 'Running'
  always:
    - name: "Virt | Delete qa-e2e-vm-demo project"
      kubernetes.core.k8s:
        state: absent
        api_version: project.openshift.io/v1
        kind: Project
        name: qa-e2e-vm-demo

    - name: "Virt | Wait for qa-e2e-vm-demo project to be deleted"
      ansible.builtin.command: oc get project qa-e2e-vm-demo
      register: command_r
      until: command_r.rc == 1
      failed_when: false
      retries: 10
      delay: 5
