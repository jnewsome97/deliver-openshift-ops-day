---
# Exercise real ACM policy propagation/enforcement against local-cluster.
# Use a private QA namespace so the required binding name "default" cannot
# overwrite or delete a learner's existing policies/default binding.
- name: "Acm | Inspect reserved QA policy namespace ownership"
  until: qa_acm_namespace is succeeded
  retries: '{{ qa_api_retries | default(12) }}'
  delay: '{{ qa_poll_delay | default(5) }}'
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: qa-e2e-acm-policy
  register: qa_acm_namespace
- name: "Acm | Refuse to reuse an unowned policy namespace"
  ansible.builtin.assert:
    that:
      - >-
        qa_acm_namespace.resources | default([]) | length == 0 or
        qa_acm_namespace.resources[0].metadata.labels.get('app.kubernetes.io/managed-by', '') == 'ops-day-e2e'
    quiet: true

- name: "Acm | Deploy, validate, and clean up QA policy enforcement"
  block:
    - name: "Acm | Apply isolated namespace, binding, Policy and Placement"
      kubernetes.core.k8s:
        state: present
        definition: "{{ item }}"
      register: qa_acm_apply
      until:
      - qa_acm_apply is succeeded
      - qa_acm_apply is succeeded
      retries: '{{ qa_readiness_retries | default(60) }}'
      delay: 5
      loop:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: qa-e2e-acm-policy
            labels:
              app.kubernetes.io/managed-by: ops-day-e2e
        - apiVersion: cluster.open-cluster-management.io/v1beta2
          kind: ManagedClusterSetBinding
          metadata:
            name: default
            namespace: qa-e2e-acm-policy
          spec:
            clusterSet: default
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          metadata:
            name: qa-e2e-policy-compliance
            namespace: qa-e2e-acm-policy
          spec:
            remediationAction: enforce
            disabled: false
            policy-templates:
              - objectDefinition:
                  apiVersion: policy.open-cluster-management.io/v1
                  kind: ConfigurationPolicy
                  metadata:
                    name: qa-e2e-compliance-namespace
                  spec:
                    remediationAction: enforce
                    severity: high
                    object-templates:
                      - complianceType: musthave
                        objectDefinition:
                          apiVersion: v1
                          kind: Namespace
                          metadata:
                            name: qa-e2e-gdpr-workloads
                            labels:
                              data-classification: gdpr-restricted
                              compliance-framework: gdpr
        - apiVersion: cluster.open-cluster-management.io/v1beta1
          kind: Placement
          metadata:
            name: qa-e2e-placement-policy-compliance
            namespace: qa-e2e-acm-policy
          spec:
            clusterSets: [default]
            predicates:
              - requiredClusterSelector:
                  labelSelector:
                    matchLabels:
                      local-cluster: "true"
        - apiVersion: policy.open-cluster-management.io/v1
          kind: PlacementBinding
          metadata:
            name: qa-e2e-binding-policy-compliance
            namespace: qa-e2e-acm-policy
          placementRef:
            name: qa-e2e-placement-policy-compliance
            kind: Placement
            apiGroup: cluster.open-cluster-management.io
          subjects:
            - name: qa-e2e-policy-compliance
              kind: Policy
              apiGroup: policy.open-cluster-management.io

    - name: "Acm | Wait for enforced QA policy to become Compliant"
      kubernetes.core.k8s_info:
        api_version: policy.open-cluster-management.io/v1
        kind: Policy
        name: qa-e2e-policy-compliance
        namespace: qa-e2e-acm-policy
      register: qa_acm_policy
      until:
      - qa_acm_policy is succeeded
      - qa_acm_policy is succeeded
      - qa_acm_policy.resources | default([]) | length == 1
      - qa_acm_policy.resources[0].status.compliant | default('') == 'Compliant'
      retries: 20
      delay: 15

    - name: "Acm | Verify the enforced namespace labels actually landed"
      until: qa_acm_enforced is succeeded
      retries: '{{ qa_api_retries | default(12) }}'
      delay: '{{ qa_poll_delay | default(5) }}'
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: qa-e2e-gdpr-workloads
      register: qa_acm_enforced
      failed_when: >-
        qa_acm_enforced.resources | default([]) | length == 0 or
        qa_acm_enforced.resources[0].metadata.labels.get('data-classification') != 'gdpr-restricted' or
        qa_acm_enforced.resources[0].metadata.labels.get('compliance-framework') != 'gdpr'

  always:
    - name: "Acm | Delete the QA policy namespace first"
      register: _qa_retry_acm_6
      until: _qa_retry_acm_6 is succeeded
      retries: '{{ qa_api_retries | default(12) }}'
      delay: '{{ qa_poll_delay | default(5) }}'
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        name: qa-e2e-acm-policy

    - name: "Acm | Wait for policy propagation cleanup before deleting its target"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: qa-e2e-acm-policy
      register: qa_acm_policy_deleted
      until:
      - qa_acm_policy_deleted is succeeded
      - qa_acm_policy_deleted is succeeded
      - qa_acm_policy_deleted.resources | default([]) | length == 0
      retries: 60
      delay: 5

    - name: "Acm | Delete the enforced QA namespace after policy removal"
      register: _qa_retry_acm_8
      until: _qa_retry_acm_8 is succeeded
      retries: '{{ qa_api_retries | default(12) }}'
      delay: '{{ qa_poll_delay | default(5) }}'
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        name: qa-e2e-gdpr-workloads

    - name: "Acm | Wait for the enforced QA namespace to disappear"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: qa-e2e-gdpr-workloads
      register: qa_acm_target_deleted
      until:
      - qa_acm_target_deleted is succeeded
      - qa_acm_target_deleted is succeeded
      - qa_acm_target_deleted.resources | default([]) | length == 0
      retries: 60
      delay: 5
