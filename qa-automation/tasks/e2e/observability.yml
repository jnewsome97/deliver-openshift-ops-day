---
# Observability & Logging module (module_enable_observability).
# Solve/validate sequence covering the alerting portion of
# content/modules/ROOT/pages/module-09-observability.adoc: create a custom
# PrometheusRule, trigger it with a real crash-looping pod, and confirm it
# actually fires. The Loki logging stack and Tempo/OpenTelemetry tracing
# stack are NOT deployed here -- installing those operators and storage
# backends takes several minutes and leaves heavyweight, slow-to-clean-up
# infrastructure (LokiStack, TempoMonolithic, S3 buckets) that isn't worth
# the added e2e runtime/cluster load on every run; the alerting path below is
# fast, fully self-contained, and exercises the same PrometheusRule/Alertmanager
# machinery the rest of the module builds on.
#
# Uses a qa-e2e-prefixed PrometheusRule/pod/project instead of the module's
# own ops-track-alerts/crashloop-test/alert-demo names so this can never
# collide with a live learner on the same page.

- name: "Observability | Delete qa-e2e-observability-alert project"
  register: _qa_retry_observability_0
  until: _qa_retry_observability_0 is succeeded
  retries: '{{ qa_api_retries | default(12) }}'
  delay: '{{ qa_poll_delay | default(5) }}'
  kubernetes.core.k8s:
    state: absent
    api_version: project.openshift.io/v1
    kind: Project
    name: qa-e2e-observability-alert

- name: "Observability | Delete qa-e2e-alert-test PrometheusRule"
  register: _qa_retry_observability_1
  until: _qa_retry_observability_1 is succeeded
  retries: '{{ qa_api_retries | default(12) }}'
  delay: '{{ qa_poll_delay | default(5) }}'
  kubernetes.core.k8s:
    state: absent
    api_version: monitoring.coreos.com/v1
    kind: PrometheusRule
    name: qa-e2e-alert-test
    namespace: openshift-monitoring

- name: "Observability | Wait for qa-e2e-observability-alert project to be deleted"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: qa-e2e-observability-alert
  register: command_r
  until:
  - command_r is succeeded
  - command_r.resources | default([]) | length == 0
  retries: '{{ qa_namespace_delete_retries | default(60) }}'
  delay: '{{ qa_poll_delay | default(5) }}'
- name: "Observability | Run custom alert create/trigger/fire sequence"
  block:
    - name: "Observability | Create qa-e2e-observability-alert project"
      register: _qa_retry_observability_4
      until: _qa_retry_observability_4 is succeeded
      retries: '{{ qa_api_retries | default(12) }}'
      delay: '{{ qa_poll_delay | default(5) }}'
      kubernetes.core.k8s:
        state: present
        api_version: project.openshift.io/v1
        kind: Project
        name: qa-e2e-observability-alert

    - name: "Observability | Create custom HighPodRestartRate-style PrometheusRule"
      register: _qa_retry_observability_5
      until: _qa_retry_observability_5 is succeeded
      retries: '{{ qa_api_retries | default(12) }}'
      delay: '{{ qa_poll_delay | default(5) }}'
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: PrometheusRule
          metadata:
            name: qa-e2e-alert-test
            namespace: openshift-monitoring
          spec:
            groups:
              - name: qa-e2e-alert-test
                rules:
                  - alert: QaE2eHighPodRestartRate
                    expr: >-
                      increase(kube_pod_container_status_restarts_total{namespace="qa-e2e-observability-alert"}[5m]) > 2
                    for: 1m
                    labels:
                      severity: warning
                    annotations:
                      summary: "qa-e2e test pod restarting frequently"

    - name: "Observability | Deploy a crash-looping pod to trigger the rule"
      register: _qa_retry_observability_6
      until: _qa_retry_observability_6 is succeeded
      retries: '{{ qa_api_retries | default(12) }}'
      delay: '{{ qa_poll_delay | default(5) }}'
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: qa-e2e-crashloop-test
            namespace: qa-e2e-observability-alert
          spec:
            containers:
              - name: crash
                image: registry.access.redhat.com/ubi9/ubi-minimal
                command: ["/bin/sh", "-c", "sleep 2; exit 1"]
            restartPolicy: Always

    - name: "Observability | Wait for the pod to restart enough times to satisfy the rule"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        name: qa-e2e-crashloop-test
        namespace: qa-e2e-observability-alert
      register: e2e_observability_pod
      until:
      - e2e_observability_pod is succeeded
      - e2e_observability_pod.resources | default([]) | length > 0 and (e2e_observability_pod.resources[0].status.containerStatuses[0].restartCount | default(0)) >= 3
      retries: '{{ qa_readiness_retries | default(30) }}'
      delay: 10

    - name: "Observability | Require the test alert to reach Firing in Thanos"
      ansible.builtin.uri:
        url: >-
          https://{{ thanos_host }}/api/v1/query?query={{ 'ALERTS{alertname="QaE2eHighPodRestartRate",alertstate="firing"}' | urlencode }}
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ thanos_token }}"
        return_content: true
      register: e2e_observability_alert_query
      no_log: true
      retries: 60
      delay: 10
      until:
        - e2e_observability_alert_query is succeeded
        - e2e_observability_alert_query.status | default(0) == 200
        - e2e_observability_alert_query.json.status | default('') == 'success'
        - e2e_observability_alert_query.json.data.result | default([]) | length > 0
  always:
    - name: "Observability | Delete qa-e2e-observability-alert project"
      register: _qa_retry_observability_9
      until: _qa_retry_observability_9 is succeeded
      retries: '{{ qa_api_retries | default(12) }}'
      delay: '{{ qa_poll_delay | default(5) }}'
      kubernetes.core.k8s:
        state: absent
        api_version: project.openshift.io/v1
        kind: Project
        name: qa-e2e-observability-alert

    - name: "Observability | Delete qa-e2e-alert-test PrometheusRule"
      register: _qa_retry_observability_10
      until: _qa_retry_observability_10 is succeeded
      retries: '{{ qa_api_retries | default(12) }}'
      delay: '{{ qa_poll_delay | default(5) }}'
      kubernetes.core.k8s:
        state: absent
        api_version: monitoring.coreos.com/v1
        kind: PrometheusRule
        name: qa-e2e-alert-test
        namespace: openshift-monitoring

    - name: "Observability | Wait for qa-e2e-observability-alert project to be deleted"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: qa-e2e-observability-alert
      register: command_r
      until:
      - command_r is succeeded
      - command_r.resources | default([]) | length == 0
      retries: '{{ qa_namespace_delete_retries | default(60) }}'
      delay: '{{ qa_poll_delay | default(5) }}'
