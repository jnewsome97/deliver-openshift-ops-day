---
# Security module (module_enable_security): RHACS Central + Compliance
# Operator. Namespaces/names match ocp4_workload_rhacs_v2 (stackrox/central)
# and ocp4_days_workload_compliance_operator (openshift-compliance).

- name: "Security | Get RHACS central deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: central
    namespace: stackrox
  register: hc_security_central
  ignore_errors: true

- name: "Security | Record failure if RHACS central is missing or not ready"
  ansible.builtin.set_fact:
    hc_failures: "{{ hc_failures + ['security: Deployment central not ready in stackrox namespace'] }}"
  when: >-
    hc_security_central is failed or
    hc_security_central.resources | default([]) | length == 0 or
    (hc_security_central.resources[0].status.readyReplicas | default(0) | int) < 1

- name: "Security | Get compliance-operator ClusterServiceVersion"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: openshift-compliance
  register: hc_security_compliance_csvs
  ignore_errors: true

- name: "Security | Record failure if compliance-operator CSV has not succeeded"
  ansible.builtin.set_fact:
    hc_failures: "{{ hc_failures + ['security: compliance-operator CSV not Succeeded in openshift-compliance namespace'] }}"
  when: >-
    hc_security_compliance_csvs is failed or
    (
      hc_security_compliance_csvs.resources | default([])
      | selectattr('metadata.name', 'match', 'compliance-operator.*')
      | selectattr('status.phase', 'equalto', 'Succeeded')
      | list | length == 0
    )

# ocp4_days_workload_compliance_operator itself waits for exactly this:
# both ProfileBundles parsed and reporting VALID. Without it, the Compliance
# Operator UI exists but has no usable scan profiles for the module content.
- name: "Security | Get ProfileBundles"
  kubernetes.core.k8s_info:
    api_version: compliance.openshift.io/v1alpha1
    kind: ProfileBundle
    namespace: openshift-compliance
  register: hc_security_profilebundles
  ignore_errors: true

- name: "Security | Record failure if ProfileBundles are missing or not VALID"
  ansible.builtin.set_fact:
    hc_failures: "{{ hc_failures + ['security: expected 2 VALID ProfileBundles (ocp4, rhcos4) in openshift-compliance, found ' + (hc_security_profilebundles.resources | default([]) | selectattr('status.dataStreamStatus', 'defined') | selectattr('status.dataStreamStatus', 'equalto', 'VALID') | list | length | string)] }}"
  when: >-
    hc_security_profilebundles is failed or
    (
      hc_security_profilebundles.resources | default([])
      | selectattr('status.dataStreamStatus', 'defined')
      | selectattr('status.dataStreamStatus', 'equalto', 'VALID')
      | list | length < 2
    )

# ocp4_workload_rhacs_console_embed exposes Central via a reencrypt route
# instead of the operator's default passthrough route, specifically so
# Showroom can iframe-embed the RHACS console. If no reencrypt route exists,
# the embed is broken even though Central itself is healthy.
#
# The route providing this can be named either "central" (older out-of-band
# Route-patch approach) or "central-reencrypt" (the operator's own route,
# created when exposure.route.reencrypt.enabled is set on the Central CR --
# the current approach, which disables the operator's default "central"
# route entirely). So this checks all routes in the namespace rather than a
# single hardcoded name.
- name: "Security | Get routes in stackrox namespace"
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: stackrox
  register: hc_security_stackrox_routes
  ignore_errors: true

- name: "Security | Record failure if no Central route is reencrypt"
  ansible.builtin.set_fact:
    hc_failures: "{{ hc_failures + ['security: Central route in stackrox is not reencrypt (Showroom iframe embed will be blocked by X-Frame-Options)'] }}"
  when: >-
    hc_security_stackrox_routes is failed or
    (
      hc_security_stackrox_routes.resources | default([])
      | selectattr('metadata.name', 'in', ['central', 'central-reencrypt'])
      | selectattr('spec.tls.termination', 'defined')
      | selectattr('spec.tls.termination', 'equalto', 'reencrypt')
      | list | length == 0
    )
